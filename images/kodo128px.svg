<?xml version="1.0" encoding="utf-8" standalone="yes"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" baseProfile="full"
     width="128px" height="128px" viewBox="0 0 128 128"
     preserveAspectRatio="xMidYMid meet">
  <title>kodo128px.svg</title>

  <style><![CDATA[
    .eye {
      transform-box: fill-box;
      transform-origin: center;
    }
  ]]></style>

  <!-- Transparent background -->
  <rect x="0" y="0" width="128" height="128" fill="none"/>

  <!-- Base 'to' (ト): the face + nose, in the same serif font/colour as kodo128px.svg -->
  <text x="0" y="14" xml:space="preserve" text-rendering="geometricPrecision"
        font-family="serif" font-size="140px" font-weight="900"
        dominant-baseline="hanging" fill="#107C41">ト</text>

  <!-- Dakuten (゛): the two eyes, same colour, top-right -->
  <g fill="#107C41">
    <g transform="rotate(150 88 46)">
      <rect class="eye" x="74" y="43" width="8" height="21" rx="5"/>
    </g>
    <g transform="rotate(150 106 40)">
      <rect class="eye" x="97" y="37" width="8" height="21" rx="5"/>
    </g>
  </g>
</svg>
